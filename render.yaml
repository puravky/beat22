services:
  - type: web
    name: beat22-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: bun install --production
    startCommand: bun src/server.js
    envVars:
      - key: PORT
        value: 4000
      - key: BUN_VERSION
        value: 1.3.14
    healthCheckPath: /health
